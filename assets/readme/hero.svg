<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">ringo-prd2drd</title>
  <desc id="desc">A PRD-to-DRD Agent workflow with a human approval gate and schema validation.</desc>
  <rect width="1200" height="420" rx="28" fill="#0B1020"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
    <g transform="translate(58 52)">
      <text x="0" y="0" fill="#52E0D4" font-size="18" font-weight="650" letter-spacing="2">AGENT SKILL · PRD → DRD</text>
      <text x="0" y="74" fill="#F6F8FC" font-size="58" font-weight="760">ringo-prd2drd</text>
      <text x="0" y="124" fill="#B8C1D6" font-size="23">先评审采集设计，再生成机器可读的 DRD。</text>
      <g transform="translate(0 180)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
        <rect width="510" height="118" rx="16" fill="#121A2E" stroke="#2A3653"/>
        <circle cx="24" cy="24" r="5" fill="#FFB454"/>
        <circle cx="42" cy="24" r="5" fill="#52E0D4"/>
        <circle cx="60" cy="24" r="5" fill="#62708E"/>
        <text x="22" y="60" fill="#8693AE" font-size="18">$ agent</text>
        <text x="22" y="91" fill="#F6F8FC" font-size="21">根据 PRD 生成 DRD</text>
        <rect x="240" y="74" width="10" height="22" rx="2" fill="#52E0D4"/>
      </g>
    </g>
    <g transform="translate(640 42)">
      <text x="0" y="18" fill="#8693AE" font-size="17" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">REVIEW-GATED PIPELINE</text>
      <g transform="translate(0 46)">
        <rect width="500" height="64" rx="14" fill="#121A2E" stroke="#2A3653"/>
        <rect width="7" height="64" rx="4" fill="#62708E"/>
        <text x="28" y="27" fill="#8693AE" font-size="16" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">01 · INPUT</text>
        <text x="28" y="51" fill="#F6F8FC" font-size="21" font-weight="650">读取 PRD 与上下文</text>
      </g>
      <path d="M250 110v20" stroke="#44516D" stroke-width="2"/><path d="M244 124l6 8 6-8" fill="#44516D"/>
      <g transform="translate(0 130)">
        <rect width="500" height="64" rx="14" fill="#121A2E" stroke="#2A3653"/>
        <rect width="7" height="64" rx="4" fill="#52E0D4"/>
        <text x="28" y="27" fill="#52E0D4" font-size="16" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">02 · DRAFT</text>
        <text x="28" y="51" fill="#F6F8FC" font-size="21" font-weight="650">分析问题与采集点草案</text>
      </g>
      <path d="M250 194v20" stroke="#44516D" stroke-width="2"/><path d="M244 208l6 8 6-8" fill="#44516D"/>
      <g transform="translate(0 214)">
        <rect width="500" height="64" rx="14" fill="#211B22" stroke="#6A4B32"/>
        <rect width="7" height="64" rx="4" fill="#FFB454"/>
        <text x="28" y="27" fill="#FFB454" font-size="16" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">03 · HUMAN GATE</text>
        <text x="28" y="51" fill="#F6F8FC" font-size="21" font-weight="650">明确确认后才继续</text>
        <path d="M446 17v30" stroke="#FFB454" stroke-width="3"/><circle cx="446" cy="32" r="18" fill="none" stroke="#FFB454" stroke-width="2"/>
      </g>
      <path d="M250 278v20" stroke="#44516D" stroke-width="2"/><path d="M244 292l6 8 6-8" fill="#44516D"/>
      <g transform="translate(0 298)">
        <rect width="500" height="64" rx="14" fill="#102225" stroke="#285D5C"/>
        <rect width="7" height="64" rx="4" fill="#52E0D4"/>
        <text x="28" y="27" fill="#52E0D4" font-size="16" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">04 · VALIDATED</text>
        <text x="28" y="51" fill="#F6F8FC" font-size="21" font-weight="650">DRD JSON  ✓  Schema</text>
      </g>
    </g>
  </g>
</svg>
